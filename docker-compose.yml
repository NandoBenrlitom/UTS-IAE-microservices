# ============================================================================
#  Reusable env block - dipakai semua service Laravel
# ============================================================================
x-laravel-env: &laravel-env
  APP_NAME: "UTS-IAE"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "base64:8f3vJtR3Q7HlXkY8wF8VbZ1MvTjOdN0xPAQ9aXyOu6E="
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: root
  CACHE_STORE: redis
  SESSION_DRIVER: file
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QUEUE_CONNECTION: redis

services:
  # Database Utama (MySQL)
  mysql:
    image: mysql:8.0
    container_name: uts_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uts_microservices
    ports:
      - "3307:3306"   # host 3307 -> container 3306 (3306 sering dipakai XAMPP/Laragon)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  # Redis - sebagai message broker untuk Laravel Queue (Komunikasi Asinkron)
  redis:
    image: redis:alpine
    container_name: uts_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # User Service (Port 8001)
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user_service
    ports:
      - "8001:8000"
    environment:
      <<: *laravel-env
      DB_DATABASE: uts_user
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-net

  # Product Service (Port 8002)
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    ports:
      - "8002:8000"
    environment:
      <<: *laravel-env
      DB_DATABASE: uts_product
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-net

  # Order Service (Port 8003) - Producer ke Redis Queue
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_service
    ports:
      - "8003:8000"
    environment:
      <<: *laravel-env
      DB_DATABASE: uts_order
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-net

  # Queue Worker - Consumer Redis Queue, memproses ProcessOrder job (Asinkron)
  queue-worker:
    build:
      context: ./order-service
    container_name: uts_worker
    command: sh -c "until mysqladmin --skip-ssl ping -h $$DB_HOST -u$$DB_USERNAME -p$$DB_PASSWORD --silent; do echo waiting for mysql; sleep 2; done && php artisan queue:work redis --tries=3 --sleep=3 --timeout=60"
    environment:
      <<: *laravel-env
      DB_DATABASE: uts_order
    depends_on:
      order-service:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  mysql_data:
