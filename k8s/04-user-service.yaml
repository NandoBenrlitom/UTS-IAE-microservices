apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: uts-iae
  labels: { app: user-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: uts-iae/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: laravel-config }
            - secretRef: { name: laravel-secret }
          env:
            - name: DB_DATABASE
              value: uts_user
          readinessProbe:
            httpGet: { path: /up, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /up, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: uts-iae
spec:
  selector: { app: user-service }
  ports:
    - port: 8000
      targetPort: 8000
