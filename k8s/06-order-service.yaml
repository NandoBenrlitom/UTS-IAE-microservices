apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: uts-iae
  labels: { app: order-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: uts-iae/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: laravel-config }
            - secretRef: { name: laravel-secret }
          env:
            - name: DB_DATABASE
              value: uts_order
          readinessProbe:
            httpGet: { path: /up, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /up, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: uts-iae
spec:
  selector: { app: order-service }
  ports:
    - port: 8000
      targetPort: 8000
---
# Queue Worker - consumer Redis (asinkron). Tidak expose port, tidak punya Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: uts-iae
  labels: { app: queue-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: queue-worker }
  template:
    metadata:
      labels: { app: queue-worker }
    spec:
      containers:
        - name: queue-worker
          image: uts-iae/order-service:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              until mysqladmin --skip-ssl ping -h "$DB_HOST" -u"$DB_USERNAME" -p"$DB_PASSWORD" --silent; do
                echo "waiting for mysql"; sleep 2;
              done
              exec php artisan queue:work redis --tries=3 --sleep=3 --timeout=60
          envFrom:
            - configMapRef: { name: laravel-config }
            - secretRef: { name: laravel-secret }
          env:
            - name: DB_DATABASE
              value: uts_order
